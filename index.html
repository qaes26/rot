<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هاتف رنيم - ألطف بنت وأحلى بنت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'spin-slow': 'spin 4s linear infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f0c29;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .phone {
            width: 340px;
            height: 700px;
            background: #111;
            border-radius: 45px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 10px #1a1a24;
            position: relative;
            overflow: hidden;
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        .screen {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-image: url('https://images.unsplash.com/photo-1518621736915-f3b1c41bfd00?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .elegant-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(30,0,50,0.3) 0%, rgba(160,40,90,0.45) 100%);
            z-index: 1;
        }
        .sparkle {
            position: absolute;
            bottom: -20px;
            color: rgba(255, 255, 255, 0.75);
            animation: floatUp 8s infinite ease-in;
            z-index: 2;
            pointer-events: none;
            user-select: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 0.9; }
            80% { opacity: 0.9; }
            100% { transform: translateY(-700px) scale(1.2); opacity: 0; }
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .app-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .app-btn:active {
            transform: scale(0.85);
            filter: brightness(0.8);
        }
        @keyframes bounce-up {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-up {
            animation: bounce-up 2s infinite;
        }
        #lock-screen { z-index: 10; }
        #home-screen { z-index: 5; opacity: 0; pointer-events: none; }
        #app-view { z-index: 20; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .app-open { transform: translateY(0) !important; }
        .hide-screen { opacity: 0; pointer-events: none; transform: scale(1.05); }
        .show-screen { opacity: 1 !important; pointer-events: auto !important; transform: scale(1) !important; }
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 25px;
            background: #111;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div class="phone">
        <div class="notch"></div>

        <!-- Lock Screen -->
        <div id="lock-screen" class="screen flex flex-col items-center pt-24 pb-8 transition-all duration-500">

            <div id="sparkles-container"></div>

            <div class="relative z-10 text-white text-center w-full px-6 flex flex-col h-full">

                        <div class="text-7xl font-bold tracking-tight" id="time-display" style="text-shadow: 0 4px 20px rgba(0,0,0,0.5);">12:47</div>
                        <div class="text-2xl font-bold mb-2 opacity-80" id="ampm-display">ص</div>
                    </div>
                </div>

                <div class="mt-8 space-y-3 w-full">
                    <div class="glass-panel rounded-2xl p-4 text-right flex items-center gap-3">

                        <div>
                            <div class="font-bold text-sm">إهداء لطيف</div>
                            <div class="text-xs opacity-80">رنيم، لديكِ رسائل جميلة وأغنية راقية...</div>
                        </div>
                    </div>

                <div class="mt-auto flex flex-col items-center">
                    <button id="unlock-btn" class="mb-8 flex flex-col items-center text-white/80 animate-bounce-up cursor-pointer p-4">

                        <span class="text-sm tracking-wide">اسحبي للفتح يا رنيم ✨</span>
                    </button>
                    <div class="text-[10px] text-white/50 font-medium">إعداد قيس جازي</div>
                </div>
            </div>
        </div>

        <!-- Home Screen -->
        <div id="home-screen" class="screen">
            <div class="elegant-overlay" style="background: linear-gradient(to bottom, rgba(10,5,20,0.5) 0%, rgba(100,20,50,0.6) 100%);"></div>

            <div class="relative z-10 w-full h-full pt-10 pb-6 px-5 flex flex-col">
                <div class="flex justify-between items-center text-white text-xs mb-8 px-2 font-medium">
                    <span id="status-time">12:47</span>
                    <div class="flex gap-2">
                        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21L15.6 16.2C14.6 15.4 13.4 15 12 15C10.6 15 9.4 15.4 8.4 16.2L12 21ZM12 3C7.9 3 4.2 4.6 1.4 7.2L3.8 10.4C5.9 8.5 8.8 7.3 12 7.3C15.2 7.3 18.1 8.5 20.2 10.4L22.6 7.2C19.8 4.6 16.1 3 12 3Z"></path></svg>
                        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M2 22H22V2L2 22Z"></path></svg>
                        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M15.67 4H14V2H10V4H8.33C7.6 4 7 4.6 7 5.33V20.67C7 21.4 7.6 22 8.33 22H15.67C16.4 22 17 21.4 17 20.67V5.33C17 4.6 16.4 4 15.67 4Z"></path></svg>
                    </div>
                </div>

                <div class="grid grid-cols-4 gap-y-6 gap-x-4">
                    <button class="app-btn flex flex-col items-center gap-1" onclick="openApp('messages')">
                        <div class="w-14 h-14 bg-gradient-to-tr from-green-400 to-green-600 rounded-2xl flex items-center justify-center shadow-lg">
                            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>

                    <button class="app-btn flex flex-col items-center gap-1" onclick="openApp('gallery')">

                            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        </div>
                        <span class="text-white text-xs font-medium">المعرض</span>

                    <button class="app-btn flex flex-col items-center gap-1" onclick="openApp('music')">
                        <div class="w-14 h-14 bg-gradient-to-tr from-red-500 to-orange-500 rounded-2xl flex items-center justify-center shadow-lg">
                            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                        </div>
                        <span class="text-white text-xs font-medium">الموسيقى</span>

                    <button class="app-btn flex flex-col items-center gap-1" onclick="openApp('weather')">
                        <div class="w-14 h-14 bg-gradient-to-tr from-blue-400 to-blue-600 rounded-2xl flex items-center justify-center shadow-lg">
                            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
                        </div>
                        <span class="text-white text-xs font-medium">الطقس</span>

                    <button class="app-btn flex flex-col items-center gap-1" onclick="openApp('maps')">
                        <div class="w-14 h-14 bg-gradient-to-tr from-green-300 to-blue-500 rounded-2xl flex items-center justify-center shadow-lg">
                            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                        </div>
                        <span class="text-white text-xs font-medium">الخرائط</span>
                    </button>

                    <button class="app-btn flex flex-col items-center gap-1" onclick="openApp('notes')">
                        <div class="w-14 h-14 bg-gradient-to-tr from-yellow-300 to-yellow-500 rounded-2xl flex items-center justify-center shadow-lg text-yellow-900">
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        </div>
                        <span class="text-white text-xs font-medium">ملاحظات</span>
                    </button>

                    <button class="app-btn flex flex-col items-center gap-1" onclick="openApp('calendar')">
                        <div class="w-14 h-14 bg-gradient-to-tr from-red-400 to-red-600 rounded-2xl flex flex-col items-center justify-center shadow-lg text-white">
                            <span class="text-[10px] font-bold uppercase mt-1" id="cal-month">نوفمبر</span>
                            <span class="text-xl font-bold leading-none" id="cal-day">19</span>
                        </div>
                        <span class="text-white text-xs font-medium">التقويم</span>
                    </button>

                    <button class="app-btn flex flex-col items-center gap-1" onclick="openApp('about')">
                        <div class="w-14 h-14 bg-gradient-to-tr from-gray-600 to-gray-800 rounded-2xl flex items-center justify-center shadow-lg">
                            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        </div>
                        <span class="text-white text-xs font-medium">حول</span>
                    </button>
                </div>

                <div class="mt-auto mb-2 w-full">
                    <div class="glass-panel rounded-3xl p-3 flex justify-around items-center">
                        <button class="app-btn w-12 h-12 bg-gradient-to-tr from-green-400 to-green-500 rounded-2xl flex items-center justify-center shadow-md" onclick="openApp('phone')">
                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>

                </div>
            </div>
        </div>

        <!-- App View -->
        <div id="app-view" class="screen bg-white text-gray-800 flex flex-col">
            <div class="pt-12 pb-4 px-4 border-b flex items-center gap-3 bg-gray-50/90 backdrop-blur-md relative z-10 shadow-sm">
                <button onclick="closeApp()" class="text-blue-500 flex items-center text-sm font-medium hover:text-blue-700 transition">
                    <svg class="w-5 h-5 mr-1 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>

            </div>

            <div class="flex-1 overflow-y-auto p-6 relative bg-pink-50/30">

            </div>

            <div class="w-full h-8 flex justify-center items-center bg-transparent absolute bottom-0 z-50 cursor-pointer" onclick="closeApp()">
                <div class="w-1/3 h-1 bg-gray-300 rounded-full"></div>
            </div>
        </div>
    </div>

    <script>
        // --- مشغل الأغنية: الملف song.mp3 في نفس مجلد index.html ---
        const songAudio = new Audio('song.mp3');
        songAudio.loop = true;
        songAudio.preload = 'auto';
        let isPlaying = false;

        window.toggleMusic = function() {
            if (isPlaying) {
                songAudio.pause();
                isPlaying = false;
                updateMusicUI();
            } else {
                songAudio.play().then(() => {
                    isPlaying = true;
                    updateMusicUI();
                }).catch(e => {
                    console.log("تعذر تشغيل الأغنية:", e);
                    isPlaying = false;
                    updateMusicUI();
                    alert("تأكد من وجود ملف 'song.mp3' في نفس المجلد مع index.html على GitHub.");
                });
            }
        };

        window.updateMusicUI = function() {
            const playIcon = document.getElementById('music-play-icon');
            const recordPlayer = document.getElementById('music-record-player');

            if (playIcon) {
                playIcon.innerHTML = isPlaying
                    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
                    : '<path d="M8 5v14l11-7z"/>';
            }
            if (recordPlayer) {
                recordPlayer.classList.toggle('animate-spin-slow', isPlaying);
            }
        };

        const appsData = {
            messages: {
                title: "الرسائل",
                icon: `<div class="bg-green-100 text-green-600 p-4 rounded-full mb-6"><svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg></div>`,
                content: `<h2 class="text-2xl font-bold text-gray-800 mb-4">إلى رنيم ✨</h2>
                          <p class="text-lg text-gray-600 leading-relaxed">بعض الأسماء تحمل معها جمالاً خاصاً، واسمكِ يا رنيم يرتبط دائماً باللطف والرقي، لتبقي بحق ألطف بنت وأحلى بنت قابلتها.</p>`
            },
            gallery: {
                title: "المعرض",
                icon: `<div class="bg-purple-100 text-purple-600 p-4 rounded-full mb-6"><svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg></div>`,
                content: `<h2 class="text-2xl font-bold text-gray-800 mb-4">لوحة فنية 🎨</h2>
                          <p class="text-lg text-gray-600 leading-relaxed">أجمل ما في الأيام ليس تفاصيلها ولا أماكنها، بل ذلك الحضور الهادئ والابتسامة الراقية التي تميز رنيم عن الجميع.</p>`
            },
            music: {
                title: "الموسيقى",
                icon: ``,
                content: `
                    <div class="flex flex-col items-center">
                        <div id="music-record-player" class="w-40 h-40 rounded-full shadow-lg mb-6 overflow-hidden border-4 border-red-100">
                            <img src="https://images.unsplash.com/photo-1514525253361-bee8a48790c3?q=80&w=500" class="w-full h-full object-cover">
                        </div>
                        <h2 class="text-2xl font-bold text-gray-800 mb-2">آه يا حلو</h2>
                        <p class="text-sm text-red-500 font-bold mb-6">إهداء راقٍ إلى رنيم</p>

                        <button onclick="toggleMusic()" class="bg-red-500 text-white p-5 rounded-full shadow-lg hover:bg-red-600 transition-all transform hover:scale-105 mb-6">
                            <svg id="music-play-icon" class="w-10 h-10" fill="currentColor" viewBox="0 0 24 24">
                            </svg>
                        </button>

                        <p class="mt-2 text-sm text-gray-600 leading-relaxed italic border-t border-gray-200 pt-6">"الألحان الجميلة والكلمات اللطيفة تليق دائماً بصاحبات الذوق الرفيع والحضور المميز مثل رنيم."</p>
                    </div>`
            },
            weather: {
                title: "الطقس",
                icon: `<div class="bg-blue-100 text-blue-600 p-4 rounded-full mb-6"><svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg></div>`,
                content: `<h2 class="text-2xl font-bold text-gray-800 mb-4">حالة الطقس 🌤️</h2>
                          <p class="text-lg text-gray-600 leading-relaxed">الأجواء تزداد إشراقاً وبهجة بوجود الشخصيات اللطيفة والجميلة مثل رنيم.</p>`
            },
            maps: {
                title: "الخرائط",
                icon: `<div class="bg-green-100 text-green-600 p-4 rounded-full mb-6"><svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg></div>`,
                content: `<h2 class="text-2xl font-bold text-gray-800 mb-4">خريطة اللطف 🧭</h2>
                          <p class="text-lg text-gray-600 leading-relaxed">في كل مكان تكونين فيه، يبقى اللطف والرقي والجمال الهادئ عنواناً يرافق حضور رنيم.</p>`

        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'م' : 'ص';

            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;

            const timeString = `${hours}:${minutes}`;
            document.getElementById('time-display').innerText = timeString;
            document.getElementById('status-time').innerText = timeString;
            document.getElementById('ampm-display').innerText = ampm;

            const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];

            const dayName = days[now.getDay()];
            const monthName = months[now.getMonth()];
            const dateNum = now.getDate();

            const arabicNumerals = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            const convertNum = (num) => String(num).split('').map(c => arabicNumerals[c] || c).join('');

            document.getElementById('date-display').innerText = `${dayName}، ${convertNum(dateNum)} ${monthName}`;
            document.getElementById('cal-month').innerText = monthName;
            document.getElementById('cal-day').innerText = dateNum;
        }

        setInterval(updateTime, 1000);
        updateTime();

        const lockScreen = document.getElementById('lock-screen');
        const homeScreen = document.getElementById('home-screen');
        const appView = document.getElementById('app-view');
        const unlockBtn = document.getElementById('unlock-btn');

        function unlockPhone() {
            lockScreen.classList.add('hide-screen');
            setTimeout(() => {
                homeScreen.classList.add('show-screen');
            }, 200);
        }

        unlockBtn.addEventListener('click', unlockPhone);

        let startY = 0;
        lockScreen.addEventListener('touchstart', e => { startY = e.changedTouches[0].screenY; });
        lockScreen.addEventListener('touchend', e => {
            let endY = e.changedTouches[0].screenY;
            if (startY - endY > 50) unlockPhone();
        });

        window.openApp = function(appId) {
            const data = appsData[appId];
            if(!data) return;

            document.getElementById('app-title').innerText = data.title;
            document.getElementById('app-content').innerHTML = `
                ${data.icon || ''}
                ${data.content}
            `;

            appView.classList.add('app-open');

            if(appId === 'music') {
                updateMusicUI();
            }
        }

        window.closeApp = function() {
            appView.classList.remove('app-open');
        }

        function createSparkles() {
            const container = document.getElementById('sparkles-container');
            const icons = ['✨', '⭐', '🌸'];
            for(let i = 0; i < 8; i++) {
                setTimeout(() => {
                    let item = document.createElement('div');
                    item.className = 'sparkle';
                    item.innerText = icons[Math.floor(Math.random() * icons.length)];
                    item.style.left = Math.random() * 90 + 5 + '%';
                    item.style.fontSize = (Math.random() * 10 + 12) + 'px';
                    item.style.animationDuration = (Math.random() * 5 + 5) + 's';
                    container.appendChild(item);

                    setTimeout(() => { item.remove(); }, 10000);
                }, i * 900);
            }
        }
        createSparkles();
        setInterval(createSparkles, 10000);
    </script>
